name: 🐛 Bug Report
description: File a bug report or report unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Before opening an issue, please ensure you have tested with the latest version of `create-ai-workspace`.
  - type: input
    id: version
    attributes:
      label: Foundry / create-ai-workspace Version
      description: What version of `create-ai-workspace` are you running? (Check with `npx create-ai-workspace --version`)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node version and Operating System
      placeholder: "Node v20.11.0, Windows 11 / macOS Sonoma / Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command & Reproduction Steps
      description: The exact command line arguments used and steps to reproduce.
      placeholder: |
        1. Run `npx create-ai-workspace my-project --type api --lang python`
        2. Inspect output in `./my-project`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Logs
      description: What actually happened? Please paste terminal output or stack traces.
    validations:
      required: true
